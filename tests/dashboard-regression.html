<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard browser regressions</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #172033; }
    h1 { font-size: 1.4rem; }
    #results { padding-left: 24px; }
    .pass { color: #15803d; }
    .fail { color: #dc2626; }
    #app-frame { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
  </style>
</head>
<body>
  <h1>Dashboard browser regressions</h1>
  <p id="status" role="status">Loading the app in a mobile-sized browser frame…</p>
  <ol id="results"></ol>
  <iframe id="app-frame" src="../index.html" title="Energy app under test"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('app-frame');
      const results = document.getElementById('results');
      const status = document.getElementById('status');

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function addResult(name, passed, detail) {
        const item = document.createElement('li');
        item.className = passed ? 'pass' : 'fail';
        item.textContent = `${passed ? 'PASS' : 'FAIL'}: ${name}${detail ? ` — ${detail}` : ''}`;
        results.appendChild(item);
      }

      function check(name, callback) {
        try {
          const detail = callback();
          addResult(name, true, detail);
        } catch (error) {
          addResult(name, false, error.message);
        }
      }

      function dateDaysAgo(daysAgo) {
        const date = new Date();
        date.setHours(12, 0, 0, 0);
        date.setDate(date.getDate() - daysAgo);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function reading(plantId, meterType, daysAgo, daysElapsed, deltaKwh, calculatedPf = 0.92) {
        return {
          plantId,
          meterType,
          date: dateDaysAgo(daysAgo),
          daysElapsed,
          deltaKwh,
          kwh: deltaKwh,
          avgDailyKwh: deltaKwh / daysElapsed,
          calculatedPf,
          md: 12
        };
      }

      frame.addEventListener('load', () => {
        try {
          const appWindow = frame.contentWindow;
          const appDocument = frame.contentDocument;
          appDocument.querySelectorAll('.modal-backdrop.active').forEach(modal => modal.classList.remove('active'));
          const plant = {
            id: 'factory-a',
            contractDemand: 20,
            hasSolar: true,
            subMeters: [{ id: 'sub_one', name: 'Mixer' }, { id: 'sub_two', name: 'Pump' }]
          };
          const fixtureReadings = [
            reading('factory-a', 'main', 1, 3, 30),
            reading('factory-a', 'main', 4, 4, 80),
            reading('factory-a', 'main', 8, 4, 120),
            reading('factory-a', 'main', 12, 8, 320),
            reading('factory-a', 'main', 20, 10, 500),
            reading('factory-b', 'main', 1, 1, 900),
            reading('factory-a', 'solar', 1, 3, 6),
            reading('factory-a', 'solar', 4, 4, 20),
            reading('factory-a', 'sub_one', 1, 3, 12),
            reading('factory-a', 'sub_one', 4, 4, 16),
            reading('factory-a', 'sub_two', 1, 3, 18),
            reading('factory-a', 'sub_two', 4, 4, 24),
            reading('factory-empty', 'main', 45, 5, 100),
            { plantId: 'factory-missing', meterType: 'main', date: dateDaysAgo(1), daysElapsed: 1 }
          ];

          appWindow.__dashboardTestPlant = plant;
          appWindow.__dashboardTestReadings = fixtureReadings;
          appWindow.eval(`
            ContractorManager.getActivePlant = () => window.__dashboardTestPlant;
            HistoryManager.getAllReadings = () => window.__dashboardTestReadings;
            App.currentMeterType = 'main';
            App.dashboardAverageDays = 7;
            App.refreshDashboardMetrics('factory-a');
          `);

          const periodButton = appDocument.getElementById('dashboardAverageDays');
          const averageTitle = appDocument.getElementById('lblMetricAverageTitle');
          const averageCard = appDocument.getElementById('cardMetricAverageUnits');
          const averageValue = appDocument.getElementById('metricAverageUnits');
          function chooseDays(days) {
            let attempts = 0;
            while (appWindow.App.dashboardAverageDays !== days && attempts < 3) {
              periodButton.click();
              attempts++;
            }
            return parseFloat(averageValue.textContent);
          }
          function chooseAverageMeter(meterType) {
            appDocument.getElementById('dashboardAverageMeterButton').click();
            const option = appDocument.querySelector(`[data-meter-type="${meterType}"]`);
            assert(option, `average meter option ${meterType} must be available`);
            option.click();
          }
          function tapAverageCardAt(xRatio, yRatio) {
            const rect = averageCard.getBoundingClientRect();
            const target = appDocument.elementFromPoint(
              rect.left + rect.width * xRatio,
              rect.top + rect.height * yRatio
            );
            assert(target === periodButton, 'the full average card surface must activate the period control');
            target.click();
          }
          function closeTo(actual, expected) {
            return Number.isFinite(actual) && Math.abs(actual - expected) < 0.01;
          }

          check('bill estimate UI and calculator are absent while dashboard and report tools remain', () => {
            assert(!appDocument.getElementById('billingEstimateModal'), 'bill estimate modal must not be present');
            assert(!appDocument.getElementById('btnDownloadBillEstimate'), 'bill estimate download button must not be present');
            assert(!Array.from(appDocument.querySelectorAll('button')).some(button => /PGVCL HT-1 Bill Estimate/i.test(button.textContent)), 'bill estimate dashboard action must not be present');
            assert(typeof appWindow.BillingCalculator === 'undefined', 'bill estimate calculator must not be exposed');
            assert(appDocument.getElementById('cardMetricAverageUnits'), 'dashboard average card must remain present');
            assert(appDocument.getElementById('dailyReadingForm'), 'daily reading form must remain present');
            assert(appDocument.getElementById('exportCsvModal'), 'energy report export modal must remain present');
            return 'Estimate controls and calculator removed; dashboard readings and report export remain';
          });

          check('dashboard unit totals display kWh only while preserving high values', () => {
            const latestReading = fixtureReadings.find(item => item.plantId === 'factory-a' && item.meterType === 'main');
            const originalDelta = latestReading.deltaKwh;
            latestReading.deltaKwh = 1250;
            appWindow.App.refreshDashboardMetrics('factory-a');
            assert(appDocument.getElementById('metricUnits').textContent === '1,250 kWh', `expected 1,250 kWh only, received ${appDocument.getElementById('metricUnits').textContent}`);
            assert(!appDocument.getElementById('metricUnits').textContent.includes('MWh'), 'dashboard units must not include an MWh presentation');
            latestReading.deltaKwh = originalDelta;
            appWindow.App.refreshDashboardMetrics('factory-a');
            return 'Large dashboard values remain expressed only in kWh';
          });

          check('the full average card cycles 7 to 15 to 30 days and wraps to 7', () => {
            assert(averageTitle.textContent === 'Average Daily Main Meter Units · 7 days', 'the title must include the initial period');
            assert(!appDocument.getElementById('dashboardAverageDaysLabel'), 'a separate period label must not be present');
            assert(!appDocument.getElementById('metricAverageCoverage'), 'average hints must not be present');
            assert(periodButton.getAttribute('aria-label').includes('15 days'), 'accessible label must describe the next period');
            assert(periodButton.tagName === 'BUTTON' && periodButton.type === 'button', 'period control must have button semantics');
            assert(periodButton.tabIndex >= 0, 'period control must be reachable by keyboard');
            periodButton.focus();
            assert(appDocument.activeElement === periodButton, 'period control must receive keyboard focus');
            tapAverageCardAt(0.2, 0.2);
            assert(averageTitle.textContent === 'Average Daily Main Meter Units · 15 days', 'tap near the card header must select 15 days');
            tapAverageCardAt(0.8, 0.8);
            assert(averageTitle.textContent === 'Average Daily Main Meter Units · 30 days', 'tap near the card footer must select 30 days');
            periodButton.click();
            assert(averageTitle.textContent === 'Average Daily Main Meter Units · 7 days', 'button activation must wrap to 7 days');
            return 'Whole-card taps cycle periods, the title displays the selection, and the control remains keyboard reachable';
          });
          check('7-day selection prorates overlapping intervals and excludes uncovered days', () => {
            assert(appWindow.App.dashboardAverageDays === 7, '7 days must be the default');
            const average = chooseDays(7);
            assert(closeTo(average, 15), `expected 15.00 kWh/day, received ${average}`);
            return averageValue.textContent;
          });
          check('15-day selection uses only the interval portion inside its window', () => {
            const average = chooseDays(15);
            assert(closeTo(average, 25), `expected 25.00 kWh/day, received ${average}`);
            return averageValue.textContent;
          });
          check('30-day selection uses stored interval kWh and elapsed days', () => {
            const average = chooseDays(30);
            assert(closeTo(average, 1050 / 29), `expected ${(1050 / 29).toFixed(2)} kWh/day, received ${average}`);
            return averageValue.textContent;
          });
          check('average is scoped to the requested factory and meter', () => {
            appWindow.eval(`App.currentMeterType = 'main'; App.refreshDashboardMetrics('factory-b');`);
            assert(closeTo(parseFloat(averageValue.textContent), 900), `expected factory-b average of 900, received ${averageValue.textContent}`);
            chooseDays(7);
            appWindow.eval(`App.currentMeterType = 'solar'; App.refreshDashboardMetrics('factory-a');`);
            assert(closeTo(parseFloat(averageValue.textContent), 3.5), `expected solar average of 3.50, received ${averageValue.textContent}`);
            assert(appDocument.getElementById('lblMetricAverageTitle').textContent === 'Average Daily Solar Generation · 7 days', 'solar label must include generation and the period');
            return 'Factory isolation and Solar Generation label verified';
          });
          check('meter chooser is hidden outside sub-meter context and card taps do not open it', () => {
            appWindow.eval(`App.currentMeterType = 'main'; App.refreshDashboardMetrics('factory-a');`);
            const selector = appDocument.getElementById('dashboardAverageMeterSelector');
            assert(appWindow.getComputedStyle(selector).display === 'none', 'main context must hide the sub-meter chooser');
            tapAverageCardAt(0.75, 0.45);
            assert(appDocument.getElementById('dashboardAverageMeterMenu').hidden, 'a period-card tap must not open the sub-meter menu');
            chooseDays(7);
            appWindow.eval(`App.currentMeterType = 'solar'; App.refreshDashboardMetrics('factory-a');`);
            assert(appWindow.getComputedStyle(selector).display === 'none', 'solar context must hide the sub-meter chooser');
            assert(closeTo(parseFloat(averageValue.textContent), 3.5), `expected solar average of 3.50, received ${averageValue.textContent}`);
            return 'Main and Solar contexts have no meter chooser; card taps only cycle periods';
          });
          check('sub-meter chooser lists only configured meters and preserves dashboard scope', () => {
            appWindow.eval(`App.currentMeterType = 'submeters'; App.dashboardAverageMeterType = 'submeters'; App.dashboardAverageMeterContext = null; App.refreshDashboardMetrics('factory-a');`);
            const selector = appDocument.getElementById('dashboardAverageMeterSelector');
            assert(appWindow.getComputedStyle(selector).display !== 'none', 'sub-meter context must show the configured sub-meter chooser');
            const meterButton = appDocument.getElementById('dashboardAverageMeterButton');
            assert(meterButton.tagName === 'BUTTON' && meterButton.tabIndex >= 0, 'sub-meter chooser must remain a keyboard-reachable button');
            const subMeterUnits = appDocument.getElementById('metricUnits').textContent;
            chooseAverageMeter('sub_one');
            assert(closeTo(parseFloat(averageValue.textContent), 4), `expected Mixer average of 4.00, received ${averageValue.textContent}`);
            assert(appWindow.App.currentMeterType === 'submeters', 'chooser selection must not change dashboard scope');
            assert(appDocument.getElementById('metricUnits').textContent === subMeterUnits, 'sub-meter units must remain in the current dashboard context');
            assert(appDocument.getElementById('lblMetricAverageTitle').textContent.includes('Sub-Meter Units · Mixer'), 'selected sub-meter name must appear with the sub-meter label');
            chooseAverageMeter('sub_two');
            assert(closeTo(parseFloat(averageValue.textContent), 6), `expected Pump average of 6.00, received ${averageValue.textContent}`);
            appDocument.getElementById('dashboardAverageMeterButton').click();
            const menuOptions = Array.from(appDocument.querySelectorAll('#dashboardAverageMeterMenu [data-meter-type]')).map(option => option.dataset.meterType);
            assert(menuOptions.length === 2 && menuOptions.includes('sub_one') && menuOptions.includes('sub_two'), 'menu must list only configured sub-meter IDs');
            assert(!menuOptions.includes('main') && !menuOptions.includes('solar') && !menuOptions.includes('submeters'), 'menu must not include Main, Solar, or aggregate placeholders');
            const firstOption = appDocument.querySelector('#dashboardAverageMeterMenu [data-meter-type]');
            firstOption.focus();
            assert(appDocument.activeElement === firstOption, 'sub-meter menu options must remain keyboard-focusable');
            meterButton.click();
            return 'Only configured sub-meters are selectable without changing dashboard scope';
          });
          check('sub-meter average sums each meter’s observed daily rate', () => {
            appWindow.eval(`App.currentMeterType = 'submeters'; App.dashboardAverageMeterType = 'submeters'; App.dashboardAverageMeterContext = null; App.refreshDashboardMetrics('factory-a');`);
            assert(closeTo(parseFloat(averageValue.textContent), 10), `expected combined sub-meter average of 10, received ${averageValue.textContent}`);
            assert(appDocument.getElementById('lblMetricAverageTitle').textContent === 'Average Daily Sub-Meter Units · 7 days', 'sub-meter label must include the period');
            assert(!appDocument.getElementById('metricAverageCoverage'), 'sub-meter context must not restore average hint text');
            return averageValue.textContent;
          });
          check('no covered reading interval is displayed as unavailable, not zero', () => {
            chooseDays(30);
            appWindow.eval(`App.currentMeterType = 'main'; App.refreshDashboardMetrics('factory-empty');`);
            assert(averageValue.textContent === '—', `expected unavailable marker, received ${averageValue.textContent}`);
            assert(!appDocument.getElementById('metricAverageCoverage'), 'unavailable averages must not show hint text');
            appWindow.eval(`App.refreshDashboardMetrics('factory-missing');`);
            assert(averageValue.textContent === '—', 'a reading with missing kWh delta must not be counted as zero');
            return 'No interval coverage remains distinct from zero consumption';
          });
          check('entry-form calculation preview remains intact', () => {
            appWindow.eval(`App.currentMeterType = 'main'; App.updateLivePreview(12, 14, 0, 0.95, 4);`);
            assert(appDocument.getElementById('liveCalcBox'), 'entry-form live calculation preview must remain present');
            assert(appDocument.getElementById('previewUnits').textContent.includes('12'), 'entry-form unit preview must still render calculated units');
            assert(appDocument.getElementById('previewPf').textContent === '0.950', 'entry-form PF preview must still render');
            return 'Existing entry-form units and PF previews remain unchanged';
          });
          check('date picker appears only for an explicit custom selection and resets with context', () => {
            const dateSection = appDocument.getElementById('readingDateSection');
            const daySelect = appDocument.getElementById('inputDaySelect');
            const dateInput = appDocument.getElementById('inputDate');
            appWindow.eval(`
              window.__dashboardDatePickerOriginals = {
                getActivePlant: ContractorManager.getActivePlant,
                getAllReadings: HistoryManager.getAllReadings,
                currentMeterType: App.currentMeterType,
                handleLiveFormCalculation: App.handleLiveFormCalculation,
                updatePreviousHints: App.updatePreviousHints,
                renderSubMetersEntryList: App.renderSubMetersEntryList
              };
              const now = new Date();
              const pad = value => String(value).padStart(2, '0');
              window.__dashboardDateTestPlant = { id: 'factory-a', subMeters: [] };
              window.__dashboardDateTestReadings = Array.from({ length: now.getDate() }, (_, index) => ({
                plantId: 'factory-a',
                meterType: 'main',
                date: \`\${now.getFullYear()}-\${pad(now.getMonth() + 1)}-\${pad(index + 1)}\`
              }));
              ContractorManager.getActivePlant = () => window.__dashboardDateTestPlant;
              HistoryManager.getAllReadings = () => window.__dashboardDateTestReadings;
              App.handleLiveFormCalculation = () => {};
              App.updatePreviousHints = () => {};
              App.renderSubMetersEntryList = () => {};
              App.currentMeterType = 'main';
            `);
            try {
              appWindow.App.initDayPicker();
              assert(daySelect.querySelector('option[value="custom"]'), 'Custom Date must remain available even when the month is complete');
              assert(daySelect.value !== 'custom', 'a rebuilt selector must not restore a stale Custom Date option');
              assert(appWindow.getComputedStyle(dateInput).display === 'none', 'completed month must keep the native date picker hidden');
              assert(dateInput.value === '', 'completed month must not retain a stale custom date');
              assert(dateSection.querySelectorAll('input[type="date"]').length === 1, 'reading date section must contain only the shared date picker');
              assert(dateSection.querySelectorAll('small').length === 0, 'the removed Reading Date hint must not return');

              daySelect.value = 'custom';
              appWindow.App.handleDaySelectChange();
              assert(appWindow.getComputedStyle(dateInput).display !== 'none', 'explicit Custom Date selection must reveal the native picker');
              dateInput.value = dateDaysAgo(0);
              dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
              assert(daySelect.value === 'custom' && appWindow.getComputedStyle(dateInput).display !== 'none', 'custom date entry must remain available after selecting a date');

              appWindow.App.initDayPicker();
              assert(daySelect.value !== 'custom' && appWindow.getComputedStyle(dateInput).display === 'none', 'refreshing an exhausted month must clear the stale custom selection');
              assert(dateInput.value === '', 'refreshing an exhausted month must clear the previous custom value');

              appWindow.__dashboardDateTestPlant = { id: 'factory-b', subMeters: [] };
              daySelect.value = 'custom';
              dateInput.value = dateDaysAgo(0);
              appWindow.App.initDayPicker();
              assert(daySelect.value !== 'custom' && appWindow.getComputedStyle(dateInput).display === 'none', 'changing factory context must not carry over Custom Date');

              appWindow.__dashboardDateTestPlant = { id: 'factory-a', subMeters: [] };
              appWindow.App.currentMeterType = 'solar';
              daySelect.value = 'custom';
              dateInput.value = dateDaysAgo(0);
              appWindow.App.initDayPicker();
              assert(daySelect.value !== 'custom' && appWindow.getComputedStyle(dateInput).display === 'none', 'changing meter context must not carry over Custom Date');
              daySelect.value = String(new Date().getDate());
              appWindow.App.handleDaySelectChange();
              assert(appWindow.getComputedStyle(dateInput).display === 'none', 'choosing a date preset must hide the native picker');
              return 'Exhausted-month, factory, meter, and preset changes hide the picker; explicit Custom Date still works';
            } finally {
              appWindow.eval(`
                const original = window.__dashboardDatePickerOriginals;
                ContractorManager.getActivePlant = original.getActivePlant;
                HistoryManager.getAllReadings = original.getAllReadings;
                App.currentMeterType = original.currentMeterType;
                App.handleLiveFormCalculation = original.handleLiveFormCalculation;
                App.updatePreviousHints = original.updatePreviousHints;
                App.renderSubMetersEntryList = original.renderSubMetersEntryList;
                delete window.__dashboardDatePickerOriginals;
                delete window.__dashboardDateTestPlant;
                delete window.__dashboardDateTestReadings;
              `);
            }
          });
          check('one visible shared date picker is used by each sub-meter entry and validation', () => {
            const dateSection = appDocument.getElementById('readingDateSection');
            const dateInput = appDocument.getElementById('inputDate');
            appWindow.__dashboardExpectedDate = dateDaysAgo(0);
            appWindow.__dashboardValidatedDates = [];
            appWindow.__dashboardSubmittedSubReadings = [];
            appWindow.__dashboardAlerts = [];
            appWindow.alert = message => appWindow.__dashboardAlerts.push(message);
            appWindow.eval(`
              ContractorManager.getActivePlant = () => window.__dashboardTestPlant;
              AuthManager.getCurrentUser = () => ({ role: 'worker', name: 'Regression Worker' });
              AuthManager.verifyAccess = () => ({ authorized: true });
              HistoryManager.canWriteToPlant = () => true;
              window.__dashboardStoredReadings = window.__dashboardTestReadings.slice();
              HistoryManager.getAllReadings = () => window.__dashboardStoredReadings;
              App.checkUserAccess = () => true;
              App.renderMeterTypeSelector = () => {};
              App.updatePowerCutStatusView = () => {};
              window.__dashboardOriginalInitDayPicker = App.initDayPicker;
              App.initDayPicker = () => {};
              App.updatePreviousHints = () => {};
              HistoryManager.recalculatePlantReadings = () => {};
              HistoryManager.renderHistoryTable = () => {};
              App.populateAnalyticsMeterSelector = () => {};
              ChartsManager.renderCharts = () => {};
              App.renderStaffList = () => {};
              App.populatePlantSettings = () => {};
              App.renderSubMetersListInSettings = () => {};
              App.handleLiveFormCalculation = () => {};
              App.currentMeterType = 'submeters';
              App.refreshSelectedFactoryView();
              const originalIsRecordAddable = HistoryManager.isRecordAddable;
              HistoryManager.isRecordAddable = function(date, plantId) {
                window.__dashboardValidatedDates.push(date);
                return plantId === 'factory-a' && originalIsRecordAddable.call(this, date, plantId);
              };
              App.showToast = () => {};
              App.refreshDashboardMetrics('factory-a');
              App.renderSubMetersEntryList(window.__dashboardTestPlant);
            `);
            assert(appWindow.getComputedStyle(dateSection).display !== 'none', 'shared reading date section must be visible for writers');
            assert(dateInput.type === 'date' && appWindow.getComputedStyle(dateInput).display === 'none', 'native date picker must be hidden while a quick preset is selected');
            assert(!appDocument.getElementById('subMeterDaySelect') && !appDocument.getElementById('subMeterCustomDate'), 'sub-meter entry must not have a duplicate date field');
            const daySelect = appDocument.getElementById('inputDaySelect');
            const todayDay = new Date().getDate();
            daySelect.innerHTML = `<option value="${todayDay}">Today</option><option value="custom">Custom Date</option>`;
            daySelect.value = String(todayDay);
            appWindow.App.updateDateFromDaySelect();
            assert(appWindow.getComputedStyle(dateInput).display === 'none', 'quick preset selection must keep the native picker hidden');
            daySelect.value = 'custom';
            appWindow.App.handleDaySelectChange();
            assert(appWindow.getComputedStyle(dateInput).display !== 'none', 'selecting Custom Date must reveal the native picker');
            dateInput.value = appWindow.__dashboardExpectedDate;
            dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
            appWindow.eval('App.initDayPicker = window.__dashboardOriginalInitDayPicker; App.initDayPicker();');
            assert(daySelect.value === String(new Date().getDate()) && dateInput.value === appWindow.__dashboardExpectedDate, 'refresh must return to the available preset for the selected date');
            assert(appWindow.getComputedStyle(dateInput).display === 'none', 'refresh must hide the native picker after clearing the custom selection');
            daySelect.value = 'custom';
            appWindow.App.handleDaySelectChange();
            dateInput.value = appWindow.__dashboardExpectedDate;
            dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
            assert(appWindow.getComputedStyle(dateInput).display !== 'none', 'custom date must be visible before a sub-meter save');
            const pressEnter = input => {
              const event = new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
              input.dispatchEvent(event);
              return event;
            };
            const subOneInput = appDocument.getElementById('inputKwh_sub_sub_one');
            const beforeInvalidSub = appWindow.__dashboardStoredReadings.length;
            subOneInput.value = '';
            pressEnter(subOneInput);
            assert(appWindow.__dashboardStoredReadings.length === beforeInvalidSub, 'empty sub-meter Enter must not save');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('Please enter kWh reading')), 'empty sub-meter Enter must show the existing validation error');
            subOneInput.value = '50';
            assert(pressEnter(subOneInput).defaultPrevented, 'sub-meter Enter must prevent native form/navigation behavior');
            appWindow.__dashboardSubmittedSubReadings.push(
              appWindow.__dashboardStoredReadings.find(reading => reading.meterType === 'sub_one' && reading.date === appWindow.__dashboardExpectedDate)
            );
            assert(appWindow.getComputedStyle(dateInput).display === 'none', 'successful sub-meter save must hide the native date picker');
            assert(dateInput.value === appWindow.__dashboardExpectedDate && daySelect.value === 'custom', 'hiding the picker must preserve the shared custom date for other sub-meters');
            const beforeDuplicate = appWindow.__dashboardStoredReadings.length;
            appDocument.getElementById('inputKwh_sub_sub_one').value = '55';
            pressEnter(appDocument.getElementById('inputKwh_sub_sub_one'));
            assert(appWindow.__dashboardStoredReadings.length === beforeDuplicate, 'duplicate sub-meter Enter must not save a second reading');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('Duplicate entries are not allowed')), 'duplicate sub-meter Enter must show the existing duplicate error');
            dateInput.value = dateDaysAgo(6);
            dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
            const subTwoInput = appDocument.getElementById('inputKwh_sub_sub_two');
            subTwoInput.value = '75';
            pressEnter(subTwoInput);
            assert(appWindow.__dashboardSubmittedSubReadings.length === 1, 'date validation must reject a sub-meter reading outside the allowed date');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('previous 4 days')), 'invalid sub-meter date must show the existing date validation error');
            dateInput.value = appWindow.__dashboardExpectedDate;
            dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
            appDocument.getElementById('inputKwh_sub_sub_two').value = '75';
            pressEnter(appDocument.getElementById('inputKwh_sub_sub_two'));
            appWindow.__dashboardSubmittedSubReadings.push(
              appWindow.__dashboardStoredReadings.find(reading => reading.meterType === 'sub_two' && reading.date === appWindow.__dashboardExpectedDate)
            );
            const saved = Array.from(appWindow.__dashboardSubmittedSubReadings).filter(Boolean);
            assert(saved.length === 2, `both configured sub-meters must accept entries for the shared date; saved ${saved.length}, validation dates ${appWindow.__dashboardValidatedDates.join(', ')}`);
            assert(saved.every(reading => reading.date === appWindow.__dashboardExpectedDate), 'each sub-meter save must use the selected shared date');
            assert(appWindow.__dashboardValidatedDates.includes(dateDaysAgo(6)), 'the selected invalid date must reach validation');
            assert(appWindow.__dashboardValidatedDates.filter(date => date === appWindow.__dashboardExpectedDate).length >= 2, 'the selected valid date must reach validation for both meters');
            return `Enter saved Mixer and Pump for ${appWindow.__dashboardExpectedDate}; invalid and duplicate entries were rejected`;
          });
          check('Enter saves valid Main and Solar readings and preserves their validation', () => {
            const dateInput = appDocument.getElementById('inputDate');
            const mainInput = appDocument.getElementById('inputKwh');
            const countFor = meterType => appWindow.__dashboardStoredReadings.filter(reading =>
              reading.plantId === 'factory-a' && reading.meterType === meterType && reading.date === appWindow.__dashboardExpectedDate
            ).length;
            appWindow.eval(`
              App.refreshSelectedFactoryView = () => App.initDayPicker();
              App.showSuccessModal = () => {};
              App.handleLiveFormCalculation = () => {};
            `);
            dateInput.value = appWindow.__dashboardExpectedDate;
            dateInput.dispatchEvent(new appWindow.Event('change', { bubbles: true }));
            appWindow.eval(`App.currentMeterType = 'main';`);
            const beforeInvalid = countFor('main');
            mainInput.value = '';
            const invalidEvent = new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
            mainInput.dispatchEvent(invalidEvent);
            assert(invalidEvent.defaultPrevented && countFor('main') === beforeInvalid, 'invalid Main Enter must be prevented and must not save');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('Please enter active kWh reading')), 'invalid Main Enter must show the existing validation error');
            mainInput.value = '100';
            appDocument.getElementById('inputKvah').value = '110';
            appDocument.getElementById('inputKvarh').value = '0';
            appDocument.getElementById('inputMd').value = '10';
            const mainEvent = new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
            mainInput.dispatchEvent(mainEvent);
            assert(mainEvent.defaultPrevented && countFor('main') === beforeInvalid + 1, 'valid Main Enter must save once');
            assert(appWindow.getComputedStyle(dateInput).display === 'none', 'successful Main save must continue to hide the native date picker');
            dateInput.value = appWindow.__dashboardExpectedDate;
            mainInput.value = '120';
            mainInput.dispatchEvent(new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
            assert(countFor('main') === beforeInvalid + 1, 'duplicate Main Enter must not save again');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('already saved')), 'duplicate Main Enter must show the existing duplicate error');

            appWindow.eval(`App.currentMeterType = 'solar';`);
            dateInput.value = appWindow.__dashboardExpectedDate;
            mainInput.value = '';
            const invalidSolarBefore = countFor('solar');
            mainInput.dispatchEvent(new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
            assert(countFor('solar') === invalidSolarBefore, 'invalid Solar Enter must not save');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('Please enter Solar kWh reading')), 'invalid Solar Enter must show the existing validation error');
            mainInput.value = '100';
            mainInput.dispatchEvent(new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
            assert(countFor('solar') === invalidSolarBefore + 1, 'valid Solar Enter must save once');
            assert(appWindow.getComputedStyle(dateInput).display === 'none', 'successful Solar save must continue to hide the native date picker');
            dateInput.value = appWindow.__dashboardExpectedDate;
            mainInput.value = '110';
            mainInput.dispatchEvent(new appWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
            assert(countFor('solar') === invalidSolarBefore + 1, 'duplicate Solar Enter must not save again');
            assert(appWindow.__dashboardAlerts.some(message => message.includes('already saved')), 'duplicate Solar Enter must show the existing duplicate error');
            return 'Main and Solar Enter submissions save once; invalid and duplicate entries remain blocked';
          });
          check('Sub-Meter edit omits KVAh, KVARh, and MD while Solar behavior remains unchanged', () => {
            appWindow.__dashboardStoredReadings.push(
              { id: 'edit-main-regression', plantId: 'factory-a', meterType: 'main', date: appWindow.__dashboardExpectedDate, kwh: 100, kvah: 110, kvarh: 5, rawMd: 10 },
              { id: 'edit-solar-regression', plantId: 'factory-a', meterType: 'solar', date: appWindow.__dashboardExpectedDate, kwh: 20, kvah: 20, kvarh: 0, rawMd: 0 },
              { id: 'edit-sub-regression', plantId: 'factory-a', meterType: 'sub_one', date: appWindow.__dashboardExpectedDate, kwh: 30, kvah: 30, kvarh: 0, rawMd: 0 }
            );
            const fieldGroups = ['groupEditKvah', 'groupEditKvarh', 'groupEditMd'];
            const areHidden = () => fieldGroups.every(id => appWindow.getComputedStyle(appDocument.getElementById(id)).display === 'none');
            const areVisible = () => fieldGroups.every(id => appWindow.getComputedStyle(appDocument.getElementById(id)).display !== 'none');

            appWindow.App.openEditModal('edit-sub-regression');
            assert(areHidden(), 'Sub-Meter edit must hide KVAh, KVARh, and MD');
            appWindow.App.closeEditModal();
            appWindow.App.openEditModal('edit-solar-regression');
            assert(areHidden(), 'Solar edit must continue to hide KVAh, KVARh, and MD');
            appWindow.App.closeEditModal();
            appWindow.App.openEditModal('edit-main-regression');
            assert(areVisible(), 'Main Meter edit must continue to show KVAh, KVARh, and MD');
            appWindow.App.closeEditModal();
            return 'Sub-Meter and Solar edits omit irrelevant fields; Main Meter fields remain available';
          });
          check('dashboard cards stay compact and ordered without overflow in Main, Solar, and Sub-Meter modes', () => {
            const originalWidth = frame.style.width;
            const cardIds = ['cardMetricUnits', 'cardMetricMd', 'cardMetricPf', 'cardMetricAverageUnits'];
            const idForMode = {
              main: 'main',
              solar: 'solar',
              'sub-meter': 'submeters'
            };
            function setMode(mode) {
              const meterType = idForMode[mode];
              appWindow.eval(`App.currentMeterType = '${meterType}'; App.dashboardAverageMeterType = '${meterType}'; App.dashboardAverageMeterContext = null; App.refreshDashboardMetrics('factory-a');`);
            }
            function checkNoHorizontalOverflow(mode, width) {
              const grid = appDocument.querySelector('.metrics-grid');
              assert(appDocument.documentElement.scrollWidth <= appWindow.innerWidth, `${mode} at ${width}px must not overflow the viewport`);
              assert(grid.scrollWidth <= grid.clientWidth, `${mode} at ${width}px must not overflow the metric grid`);
              const gridRect = grid.getBoundingClientRect();
              const visibleRects = cardIds
                .map(id => appDocument.getElementById(id))
                .filter(card => appWindow.getComputedStyle(card).display !== 'none')
                .map(card => card.getBoundingClientRect());
              assert(visibleRects.every(rect => rect.left >= gridRect.left && rect.right <= gridRect.right + 1), `${mode} at ${width}px must keep cards inside the grid`);
              return visibleRects;
            }
            function verifyMobile(mode, width) {
              frame.style.width = `${width}px`;
              assert(appWindow.matchMedia('(max-width: 640px)').matches, `${width}px frame must use the mobile breakpoint`);
              setMode(mode);
              const rects = checkNoHorizontalOverflow(mode, width);
              const units = appDocument.getElementById('cardMetricUnits').getBoundingClientRect();
              const average = appDocument.getElementById('cardMetricAverageUnits').getBoundingClientRect();
              assert(Math.abs(units.top - average.top) < 2 && units.left < average.left, `${mode} at ${width}px must place Units and Average side-by-side in the first row`);
              assert(Math.abs(units.height - average.height) < 1, `${mode} at ${width}px must keep Units and Average cards the same compact height`);
              if (mode === 'main') {
                const pf = appDocument.getElementById('cardMetricPf');
                const md = appDocument.getElementById('cardMetricMd');
                const pfRect = pf.getBoundingClientRect();
                const mdRect = md.getBoundingClientRect();
                assert(Math.abs(pfRect.top - mdRect.top) < 2 && pfRect.top > units.top && pfRect.left < mdRect.left, `Main at ${width}px must place PF and MD side-by-side in the next row`);
                assert(Math.abs(pfRect.height - mdRect.height) < 1, `Main at ${width}px must keep PF and MD cards the same height`);
                for (const id of ['cardMetricPf', 'cardMetricMd']) {
                  const compact = appDocument.getElementById(id);
                  assert(parseFloat(appWindow.getComputedStyle(compact).paddingTop) === 12, `${id} must use compact mobile padding`);
                }
                for (const childId of ['lblMetricPfTitle', 'metricPf', 'metricPfBadge', 'lblMetricMdTitle', 'metricMd', 'metricMdBadge']) {
                  const child = appDocument.getElementById(childId);
                  assert(child.getClientRects().length > 0 && appWindow.getComputedStyle(child).visibility !== 'hidden', `${childId} must remain visible`);
                }
              } else {
                assert(rects.length === 2, `${mode} must show only Units and Average cards`);
                assert(appWindow.getComputedStyle(appDocument.getElementById('cardMetricPf')).display === 'none', `${mode} must hide Power Factor`);
                assert(appWindow.getComputedStyle(appDocument.getElementById('cardMetricMd')).display === 'none', `${mode} must hide Maximum Demand`);
              }
            }
            for (const width of [390, 320]) {
              for (const mode of ['main', 'solar', 'sub-meter']) verifyMobile(mode, width);
            }

            frame.style.width = '1024px';
            assert(!appWindow.matchMedia('(max-width: 640px)').matches, '1024px frame must use the desktop layout');
            const grid = appDocument.querySelector('.metrics-grid');
            for (const mode of ['main', 'solar', 'sub-meter']) {
              setMode(mode);
              const rects = checkNoHorizontalOverflow(mode, 1024);
              assert(rects.every(rect => Math.abs(rect.top - rects[0].top) < 2), `${mode} desktop cards must share one row`);
              assert(rects.every((rect, index) => index === 0 || rect.left > rects[index - 1].left), `${mode} desktop cards must remain in source order`);
              if (mode === 'main') {
                assert(appWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length >= 4, 'Main desktop metric grid must retain four columns');
                const positions = ['cardMetricUnits', 'cardMetricMd', 'cardMetricPf', 'cardMetricAverageUnits']
                  .map(id => appDocument.getElementById(id).getBoundingClientRect().left);
                assert(positions.every((left, index) => index === 0 || left > positions[index - 1]), 'Main desktop order must remain Units, Maximum Demand, Power Factor, then Average');
              } else {
                assert(rects.length === 2, `${mode} desktop must show only Units and Average cards`);
              }
            }
            frame.style.width = originalWidth;
            return 'Main, Solar, and Sub-Meter cards are compact and ordered at 320px, 390px, and 1024px without horizontal overflow';
          });

          status.textContent = 'Browser regression checks complete.';
          status.className = results.querySelector('.fail') ? 'fail' : 'pass';
          if (!results.querySelector('.fail')) status.textContent += ' All checks passed.';
        } catch (error) {
          status.textContent = `Browser regression setup failed: ${error.message}`;
          status.className = 'fail';
          addResult('Test setup', false, error.message);
        }
      }, { once: true });
    })();
  </script>
